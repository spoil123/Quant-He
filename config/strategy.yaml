# ============================================================
# 策略配置：月度调仓 / 多头 Top50 / 流通市值加权
# ============================================================

name: "multi_factor_top50_floatmv"
description: "五因子合成打分，月末选股，次月首个交易日开盘成交，流通市值加权"

# ---------------- 调仓规则 ----------------
rebalance:
  freq: "M"                   # M=月度 | W=周度 | Q=季度
  signal_date: "last_trade"   # 月末最后一个交易日，用【收盘后】可得数据生成信号
  exec_date: "next_first"     # 次月第一个交易日执行
  exec_price: "open"          # 开盘价成交（比收盘价成交更保守、更贴近实盘）
  # 时点对齐铁律：signal 用 T 日及以前的数据，exec 在 T+1 开盘，绝不允许同日
  lag_days: 1                 # 信号与执行之间至少间隔 1 个交易日

# ---------------- 选股与加权 ----------------
selection:
  top_n: 50
  weighting: "float_mv"       # float_mv=流通市值加权 | equal=等权 | score=因子分加权 | sqrt_mv=市值平方根
  max_weight: 0.05            # 单票权重上限 5%
  min_weight: 0.002           # 单票权重下限 0.2%
  # 权重归一化：剔除超限部分后按比例再分配
  normalize: true

# ---------------- 股票池过滤（每期调仓时执行） ----------------
universe_filter:
  exclude_st: true              # 剔除 ST/*ST
  exclude_suspended: true       # 剔除当日停牌
  exclude_limit_up: true        # 剔除涨停（无法买入）
  exclude_new: true             # 剔除次新股
  min_list_days: 180
  min_avg_amount_20d: 10000000  # 20 日日均成交额下限 1000 万，防流动性陷阱
  min_price: 1.0                # 剔除 1 元以下（退市风险 + 最小变动单位影响大）

# ---------------- 回测区间 ----------------
backtest:
  start: "2019-01-01"           # 样本外区间
  end: "2023-12-31"
  initial_cash: 10000000        # 初始资金 1000 万
  benchmark: "000300"
  # 最小价格变动单位（分），影响撮合精度
  tick_size: 0.01
  # 是否允许碎股（false=按 100 股整手取整）
  allow_fractional: false
  lot_size: 100

# ---------------- 样本内外划分 ----------------
# 用于检测过拟合：样本内用于参数选择，样本外仅跑一次
periods:
  in_sample:  ["2015-01-01", "2018-12-31"]
  out_sample: ["2019-01-01", "2023-12-31"]
