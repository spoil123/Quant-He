# ============================================================
# 第 4 层：风控层配置
# 定位：介于「策略层下单意图」与「回测/实盘撮合」之间的可插拔闸门。
# 任何一笔订单必须先过风控，被拦截的订单记入风控日志。
# ============================================================
# 2026-08-31 参数扫描【样本内 2015-2018】（熔断 T+1 修复后重扫）：
#   最优组 F（仅熔断，止损关闭）：收益 46.2% / 夏普 0.4247 / 回撤 33.3% / 卡玛 0.3096（事件 1 次）
#   对照：裸奔 2.6% / 夏普 -0.04；仅止损 -19.0%（负资产，已关闭）
#   【结论（终版，勿改回）】熔断 = 用 2015-2018 长熊形态刻舟求剑的保险：
#   样本内 +43.6pp（触发 1 次后长期半仓躲过三轮下跌），
#   样本外（2019-23，ablation 实测）夏普 0.2448→0.1903、收益 -13pp【负贡献】。
#   同一机制样本内狂赚/样本外必亏 = 参数无泛化能力。
#   → 生产默认关闭熔断（run_top50 默认无风控，--risk 才开）；熔断已修 T+1 无前视。
# ============================================================

# 顶层 enabled 说明（P1-6 修正 2026-08-31）：
# 本项目的风控接入路径是 run_top50_strategy.py 的 --risk 参数，不是读这个字段。
# 此前这里写 true，但没有任何代码消费它 —— 是死配置，会让人误以为风控默认开着。
# 实际默认路径（不加 --risk）风控完全不介入。改为 false 与默认行为一致，
# 需要风控时显式 --risk 接入，并在日志打印实际生效项清单（见 RiskManager.effective_controls）。
# 各子闸门是否生效看 stop_loss.enabled / circuit_breaker.enabled（这两个字段被代码消费）。
enabled: false

# ---------------- 仓位约束 ----------------
position:
  max_single_weight: 0.05       # 单票权重上限 5%
  max_industry_weight: 0.25     # 单一行业（申万一级）权重上限 25%
  max_positions: 60             # 最大持仓只数
  min_positions: 20             # 低于此值告警（过度集中）
  # 现金下限：始终保留的最低现金比例
  min_cash_ratio: 0.02

# ---------------- 个股止损止盈 ----------------
stop_loss:
  # 2026-08-31 样本内(2015-2018)扫描结论：个股止损是纯负资产
  # （仅止损→收益-19%、回撤反升至63.7%，月频 Top50 单票5%被震荡反复洗出），
  # 【已停用】个股止损 = 负资产（样本内 2015-18 仅止损→收益 -19%、回撤 63.7%，
  # 月频 Top50 单票 5% 被震荡反复洗出）。enabled=false 时以下参数全部不生效，
  # 仅存档，供未来重新评估止损机制时参考（勿改 enabled 而不重测）。
  enabled: false
  single_stock_drawdown: -0.30
  trailing_stop: -0.40
  take_profit: null             # 止盈阈值【未实现】，null=不启用
  check_freq: "daily"           # 【未实现】当前为逐日检查，该字段无消费方
  blacklist_days: 10

# ---------------- 组合级熔断 ----------------
circuit_breaker:
  # 【已禁用 2026-08-31】连续两次样本外(2019-23)独立验证均为负贡献：
  #   ablation_1419 熔断 -13pp、ablation_1448 熔断 -11pp；
  #   唯一"赚钱"区间是 2015-2018 长熊（触发一次后长期半仓躲跌），无泛化能力。
  #   参数保留存档供未来重估，enabled 保持 false。
  enabled: false
  # 组合净值从历史最高点回撤达到阈值触发（-12%）
  drawdown_trigger: -0.12
  # 【未实现】代码只按 reduce_to 降仓，不读 action；clear/pause 两种语义
  # 目前无对应逻辑，即使重新启用熔断也不会生效（2026-09-07 死配置清理）
  action: "reduce"              # reduce=降仓 | clear=清仓 | pause=停止新开仓
  reduce_to: 0.50               # action=reduce 时降至 5 成仓位
  # 触发后冷却 N 个交易日，冷却期内维持降仓状态
  cooldown_days: 20
  # 熔断解除条件：净值回升至回撤 < trigger 的 50%
  recovery_ratio: 0.5
  # 单日跌幅熔断【未实现】—— 无消费方，启用熔断也不会触发（2026-09-07 清理）
  daily_drop_trigger: -0.07
  daily_drop_action: "pause"

# ---------------- 交易标的风险过滤 ----------------
tradability:
  exclude_st: true              # ST / *ST 禁止买入
  exclude_suspended: true       # 停牌禁止交易
  exclude_limit_up: true        # 涨停禁止买入
  exclude_limit_down: true      # 跌停禁止卖出
  exclude_new: true
  min_list_days: 180
  # 流动性：日均成交额下限
  min_avg_amount_20d: 10000000
  # 股价下限，规避退市与低价股操纵
  min_price: 1.0

# ---------------- 行业暴露 ----------------
# 注意（2026-09-07 死配置清理）：本段参数目前【未被代码消费】。
# 风控实际执行的是 position.max_industry_weight（绝对上限），
# 不依赖行业分类来源、也不做相对基准偏离控制。保留字段是给后续
# 「行业中性化 / 相对基准控偏离」预留，实现前改动不会产生任何效果。
industry:
  source: "sw_l1"
  # 相对基准（沪深300）的行业偏离上限【未实现，预留】
  max_deviation_from_benchmark: 0.10

# ---------------- 风控日志 ----------------
# 注意（2026-09-07 死配置清理）：本段参数目前【未被代码消费】。
# 日志级别由 src/common/logger.py 统一控制（.env 的 LOG_LEVEL），
# 「被拦截订单单独记录」功能尚未实现 —— 拦截目前只体现在权重裁剪结果上。
logging:
  # 被拦截订单单独记录【未实现，预留】，便于复盘规则是否合理
  intercept_log: true
  level: "WARNING"          # 【未生效】实际级别见 .env 的 LOG_LEVEL
